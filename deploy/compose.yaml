name: chaoxi-memory
services:
  memos:
    image: neosmemo/memos:26.11.1@sha256:5dcd6e6b973a55b964f2fe2ccdaa33319463ab448a23404ebb5d2acbd19299ba
    restart: unless-stopped
    environment:
      MEMOS_PORT: "5230"
      MEMOS_INSTANCE_URL: ${MEMORY_SITE_URL:?Set MEMORY_SITE_URL to your public HTTPS origin}
      MEMOS_TRUSTED_PROXIES: private
      TZ: Asia/Shanghai
    volumes:
      - memos-data:/var/opt/memos
    expose:
      - "5230"
    networks:
      - backend
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MEMORY_SPACE: ${MEMORY_SPACE:-spaces/together}
    restart: unless-stopped
    depends_on:
      - memos
    ports:
      - "${MEMORY_LISTEN:-127.0.0.1}:8080:80"
    networks:
      - backend
networks:
  backend:
volumes:
  memos-data:
    name: chaoxi-memory-data
