# The external HTTPS proxy must overwrite X-Forwarded-Proto and preserve Host.
map $http_x_forwarded_proto $memory_forwarded_proto {
    default $scheme;
    https https;
}
map $request_uri $memory_cache_control {
    default "no-cache";
    ~^/api/ "no-store";
    ~^/memos.api.AuthService/ "no-store";
    ~^/file/ "private, no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 4m; # uploads use bounded JSON/base64 chunks

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $memory_cache_control always;
    proxy_hide_header Cache-Control;

    # This private site never publishes anonymous memo-share links.
    if ($arg_share_token != "") { return 403; }
    location ~ ^/api/(shares(?:/|$)|memos/[^/]+/shares(?:/|$)) { return 403; }

    # Official browser auth uses Connect: unlike this release's REST gateway,
    # these handlers emit a standard Set-Cookie header for the refresh session.
    location /memos.api.AuthService/ {
        proxy_pass http://memos:5230;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $memory_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }
    location /api/ {
        proxy_pass http://memos:5230;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $memory_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
    location /file/ {
        proxy_pass http://memos:5230;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $memory_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
    location = /healthz {
        proxy_pass http://memos:5230/healthz;
        access_log off;
    }
    location ~ /\. { return 404; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
